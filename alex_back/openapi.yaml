components:
  schemas:
    Activation:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    ActivationRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
      required:
      - token
      - uid
    Artist:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Имя
          maxLength: 50
        covers:
          type: array
          items:
            type: string
          readOnly: true
        bio:
          type: string
          title: Биография
        releases:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseArtist'
          readOnly: true
        songs:
          type: array
          items:
            $ref: '#/components/schemas/SongArtist'
          readOnly: true
        listeners:
          type: integer
          readOnly: true
        is_liked:
          type: boolean
          readOnly: true
      required:
      - covers
      - id
      - is_liked
      - listeners
      - name
      - releases
      - songs
    ArtistLike:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Имя
          maxLength: 50
        covers:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - covers
      - id
      - name
    PasswordResetConfirm:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
        new_password:
          type: string
      required:
      - new_password
      - token
      - uid
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
      required:
      - new_password
      - token
      - uid
    PatchedPlaylistListRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Название
          maxLength: 100
    PatchedSongLikeRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
